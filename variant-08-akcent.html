.r-bar{width:100%;padding:18px 18px 8px}.r-bar .kc{align-items:flex-start}.r-bar .kc b{font-size:56px}.r-bar .tr{height:14px;border-radius:99px;background:var(--track);margin-top:14px;overflow:hidden}.r-bar .tr i{display:block;height:100%;background:var(--accent);border-radius:99px}
